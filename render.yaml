# Basmatak Tatatoua — free-tier deployment blueprint (Render)
#
# Import: Render dashboard -> New -> Blueprint, point at this repo.
# Step-by-step dashboard alternative: docs/DEPLOY.md.
#
# Every environment variable the backend reads (.env.example) is listed below.
# `sync: false` = the value is set in the Render dashboard / Secret Files, never
# committed. PORT is injected by Render and is intentionally absent. NODE_VERSION
# pins the Node runtime to ~20 (S0 baseline: Node >= 20 LTS).

services:
  - type: web
    name: basmatak-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Render puts exactly one proxy in front of the service.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        sync: false
      - key: SWAGGER_ENABLED
        sync: false
      - key: THROTTLE_TTL
        sync: false
      - key: THROTTLE_LIMIT
        sync: false
      - key: JOBS_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        sync: false
      - key: JWT_REFRESH_TTL
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SECURE
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORAGE_PROVIDER
        sync: false
      - key: STORAGE_LOCAL_DIR
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLISH_GATE_ENABLED
        sync: false
      # AI assistant: Session 3 enforces these caps in memory (single instance).
      - key: AI_AGENT_ENABLED
        sync: false
      - key: AI_AGENT_PROVIDER
        sync: false
      - key: AI_AGENT_MODEL
        sync: false
      # Gemini key is server-side only; never expose it to the frontend.
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_AGENT_KNOWLEDGE_DIR
        sync: false
      - key: AI_AGENT_MAX_INPUT_TOKENS
        sync: false
      - key: AI_AGENT_MAX_OUTPUT_TOKENS
        sync: false
      - key: AI_AGENT_MAX_HISTORY_MESSAGES
        sync: false
      - key: AI_AGENT_MAX_HISTORY_CHARS
        sync: false
      - key: AI_AGENT_MAX_KNOWLEDGE_CHUNKS
        sync: false
      - key: AI_AGENT_MAX_KNOWLEDGE_CHARS
        sync: false
      - key: AI_AGENT_MAX_TOOL_ROUNDS
        sync: false
      - key: AI_AGENT_MAX_TOOL_ROWS
        sync: false
      - key: AI_AGENT_MAX_TOOL_RESULT_CHARS
        sync: false
      - key: AI_AGENT_IP_RPM
        sync: false
      - key: AI_AGENT_IP_RPD
        sync: false
      - key: AI_AGENT_GLOBAL_RPM
        sync: false
      - key: AI_AGENT_GLOBAL_RPD
        sync: false
      - key: AI_AGENT_MAX_CONCURRENT
        sync: false
      - key: AI_AGENT_DAILY_TOKEN_BUDGET
        sync: false
      - key: AI_AGENT_RETRIEVAL_FALLBACK
        sync: false
      - key: AI_AGENT_FALLBACK_ENABLED
        sync: false