# Basmatak Tatatoua — free-tier deployment blueprint (Render)
#
# Import: Render dashboard -> New -> Blueprint, point at this repo.
# Step-by-step dashboard alternative: docs/DEPLOY.md.
#
# Every environment variable the backend reads (.env.example) is listed below.
# `sync: false` = the value is set in the Render dashboard / Secret Files, never
# committed. PORT is injected by Render and is intentionally absent. NODE_VERSION
# pins the Node runtime to ~20 (S0 baseline: Node >= 20 LTS).

services:
  - type: web
    name: basmatak-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: SWAGGER_ENABLED
        sync: false
      - key: THROTTLE_TTL
        sync: false
      - key: THROTTLE_LIMIT
        sync: false
      - key: JOBS_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        sync: false
      - key: JWT_REFRESH_TTL
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SECURE
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORAGE_PROVIDER
        sync: false
      - key: STORAGE_LOCAL_DIR
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLISH_GATE_ENABLED
        sync: false