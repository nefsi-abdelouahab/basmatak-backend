Create an account\"},\"legal\":{\"terms\":{\"label\":\"Terms of Service\",\"title\":\"Terms of Service\",\"updated\":\"Last updated: September 2026\",\"intro\":\"Welcome to Basmatak Tatatoua. By using the platform, you agree to comply with these Terms of Service.\",\"sections\":[{\"h\":\"1. About the Platform\",\"ps\":[\"Basmatak Tatatoua is a digital platform designed to facilitate access to volunteering opportunities, document volunteer contributions, and showcase completed and verified experiences.\"]},{\"h\":\"2. User Accounts\",\"bullets\":[\"You must provide accurate information when creating an account.\",\"You are responsible for keeping your login credentials secure.\",\"You may not use another person's account or create accounts using false identities.\",\"You must use the platform for lawful and legitimate purposes.\"]},{\"h\":\"3. Volunteering Opportunities\",\"ps\":[\"Registered organizations are responsible for the accuracy of the information they publish about volunteering opportunities. The platform reserves the right to review or remove any opportunity that violates these Terms or applicable laws.\"]},{\"h\":\"4. Contributions and Volunteer Experiences\",\"ps\":[\"Volunteers may provide a description of what they accomplished and attach supporting media when available. An experience is considered a Verified Experience only after confirmation by the relevant organization.\",\"Submitting false information, images, or documents, or claiming another person's work as your own, is prohibited.\"]},{\"h\":\"5. Content\",\"ps\":[\"You are responsible for the content you publish on the platform. Content must not include:\"],\"bullets\":[\"Illegal or abusive content.\",\"Personal information belonging to others without permission.\",\"Impersonating or misleading content.\",\"Material that infringes intellectual property rights.\"]},{\"h\":\"6. Public Content\",\"ps\":[\"Some information and contributions may appear on users' public profiles according to the platform's settings. Do not publish personal information that you do not want to make publicly available.\"]},{\"h\":\"7. Account Suspension\",\"ps\":[\"The platform may suspend or terminate accounts that violate these Terms or applicable laws.\"]},{\"h\":\"8. Service Availability\",\"ps\":[\"We aim to keep the platform available and reliable, but interruptions, maintenance, or service changes may occur.\"]},{\"h\":\"9. Changes to These Terms\",\"ps\":[\"These Terms may be updated when necessary. The updated version will be published with its update date.\"]},{\"h\":\"10. Contact\",\"ps\":[\"For questions regarding these Terms of Service, you can contact the Basmatak Tatatoua team through the platform's official contact channels.\"]}]},\"privacy\":{\"label\":\"Privacy Policy\",\"title\":\"Privacy Policy\",\"updated\":\"Last updated: October 2026\",\"intro\":\"At Basmatak Tatatoua, we respect your privacy and strive to protect the information you provide when using the platform.\",\"sections\":[{\"h\":\"1. Information We Collect\",\"ps\":[\"We may collect information you provide when using the platform, such as:\"],\"bullets\":[\"Your name and account information.\",\"Profile picture and public profile information.\",\"Contact information you choose to provide.\",\"Volunteering opportunities, applications, and contributions you create.\",\"Photos, videos, or files attached to your contributions.\",\"Technical information required to operate and improve the platform.\"]},{\"h\":\"2. How We Use Your Information\",\"ps\":[\"We use information to:\"],\"bullets\":[\"Create and manage your account.\",\"Allow you to apply for volunteering opportunities.\",\"Manage opportunities and volunteer contributions.\",\"Verify experiences after confirmation by the relevant organization.\",\"Display information that you choose to make public.\",\"Protect the platform and prevent misuse.\",\"Improve the platform and its services.\"]},{\"h\":\"3. Public Information\",\"ps\":[\"Some information may be publicly available, particularly information displayed on public talent profiles and verified volunteer experiences.\",\"Do not make sensitive or personal information public unless you are comfortable sharing it.\"]},{\"h\":\"4. Sharing Information\",\"ps\":[\"We do not sell users' personal information.\",\"Information may be shared when necessary to operate the service, when required by law, or when necessary to protect the rights and security of the platform and its users.\"]},{\"h\":\"5. Content and Media\",\"ps\":[\"When you upload photos, videos, or files, you are responsible for having the necessary rights to use and share them on the platform.\"]},{\"h\":\"6. Data Protection\",\"ps\":[\"We implement appropriate technical and organizational measures to help protect user data. However, no method of electronic transmission or storage can be guaranteed to be completely secure.\"]},{\"h\":\"7. Data Retention\",\"ps\":[\"We retain information for as long as necessary to provide the service or meet legal obligations.\"]},{\"h\":\"8. User Rights\",\"ps\":[\"You may request access to, correction of, or deletion of your personal information or account, subject to the capabilities of the platform and applicable laws.\"]},{\"h\":\"9. Privacy Policy Updates\",\"ps\":[\"This Privacy Policy may be updated from time to time. Any new version will be published with its update date.\"]},{\"h\":\"10. AI Assistant\",\"ps\":[\"The platform may offer an optional AI assistant that answers questions about volunteering, opportunities, organizations, and public platform information.\",\"The assistant relies only on reviewed public platform content and public data, such as published opportunities and verified organization profiles. It does not access your account, applications, private profile, or other users' personal data, and it is not intended to provide general answers from outside the platform.\",\"When you use the assistant, your message and any recent conversation you choose to include may be processed by a third-party AI provider. On the provider's free tier, content may be used to improve the provider's products and may be reviewed; do not include personal, confidential, or sensitive information in your messages.\",\"The platform does not store your assistant conversation on its servers. The current conversation is kept in your browser's session storage for the open tab and is cleared when you start a new chat, sign out, your session expires, or you close the tab.\",\"The assistant is optional, and you can continue using the rest of the platform without it.\"]},{\"h\":\"11. Contact\",\"ps\":[\"If you have questions about your privacy or how your information is processed, you can contact the Basmatak Tatatoua team through the official contact channels.\"]}]},\"about\":{\"label\":\"About\",\"title\":\"About Basmatak Tatatoua\",\"sections\":[{\"h\":\"What is Basmatak Tatatoua?\",\"ps\":[\"Basmatak Tatatoua is a digital platform designed to connect volunteers with volunteering opportunities and help associations and organizations find suitable people to participate in their initiatives.\",\"The platform focuses on documenting what volunteers actually accomplish and turning confirmed contributions into verified volunteer experiences that can help volunteers build their personal and professional journey.\"]},{\"h\":\"How does it work?\",\"bullets\":[\"For Volunteers: discover volunteering opportunities that match your skills, apply for them, participate, and document your contribution.\",\"For Associations and Organizations: create volunteering opportunities, receive volunteer applications, and verify completed contributions.\",\"For the Community: discover documented talents and volunteer work, and learn about people who contribute to their communities.\"]},{\"h\":\"Our Vision\",\"ps\":[\"We believe that everyone has skills that can create an impact, and that volunteering can be a real experience for building skills and demonstrating capabilities.\"]}],\"tagline\":\"Basmatak Tatatoua — Every contribution leaves a mark.\",\"owner\":{\"title\":\"Platform Owner\",\"name\":\"Roeya Association for Media and Audiovisual Production – Timimoun\",\"addressLabel\":\"Address\",\"address\":\"Commune of Timimoun – Timimoun District – Timimoun Province, Algeria\",\"phoneLabel\":\"Phone\",\"phone\":\"+213 663 847 105\",\"emailLabel\":\"Email\",\"email\":\"roeyatimimoun@gmail.com\"}}},\"orgProfile\":{\"overview\":\"Overview\",\"manageLabel\":\"Manage organization\",\"breadcrumbHome\":\"Home\",\"breadcrumbOrgs\":\"Organizations\",\"share\":\"Share\",\"copied\":\"Link copied\",\"websiteCta\":\"Official Website\",\"about\":\"About the organization\",\"headquarters\":\"Headquarters\",\"scope\":\"Operating scope\",\"viewApply\":\"View opportunity \u0026 apply\",\"seats\":\"{open} of {total} positions open\",\"skills\":\"Skills:\",\"deadline\":\"Deadline: {date}\",\"dates\":\"{from} – {to}\",\"location\":\"Location\",\"website\":\"Website\",\"founded\":\"Founded\",\"activeSince\":\"Active since {year}\",\"contact\":\"Contact\",\"focus\":\"Focus areas\",\"statsActive\":\"Active opportunities\",\"statsCompleted\":\"Completed opportunities\",\"statsVolunteers\":\"Volunteers\",\"statsHours\":\"Volunteer hours\",\"archive\":\"Opportunities\",\"tabPublished\":\"Open\",\"tabCompleted\":\"Completed\",\"tabClosed\":\"Closed\",\"archiveCount\":\"{total} opportunities\",\"archiveEmptyTitle\":\"Nothing here yet\",\"archiveEmptyBody\":\"There are no opportunities in this section.\",\"reliability\":\"Response rate\",\"code\":\"Code {code}\",\"verified\":\"Verified\"},\"oppDetails\":{\"mode\":\"Mode\",\"location\":\"Location\",\"endDate\":\"End date\",\"duration\":\"Duration\",\"hours\":\"{hours} hours\",\"deadline\":\"Application deadline\",\"prerequisites\":\"Prerequisites\",\"deliverables\":\"What you will deliver\",\"positions\":\"Positions\",\"seats\":\"{filled} of {required} seats filled\",\"applications\":\"{count} appl
